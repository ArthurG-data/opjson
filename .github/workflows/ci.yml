name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      # Every Bandai image is checked only for a release tag: about 5,000 requests the TCGplayer check does not need.
      - run: uv run python tools/validate.py --online ${{ startsWith(github.ref, 'refs/tags/v') && '--images' || '' }}
      - run: uv run python tools/legality.py --online

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run python tools/build.py --version "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/AllSets.json dist/AllCards.json dist/AllPrintings.json dist/AllProducts.json dist/Legality.json --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
