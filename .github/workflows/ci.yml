name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # The daily refresh starts this run on data/refresh by hand, because its own push starts no workflow.
  workflow_dispatch:

permissions:
  contents: read

# Two merges into main in a row would each release the next patch version. Queue the second run rather than race the
# first, so it sees the tag the first one made.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, since the release jobs can write: a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --group dev
      - run: uv run pytest -q
      # A UUID, once given, never changes: compare data/uuids.json with the branch a PR targets, or with where the
      # branch was before a push (every commit of the push at once), else with the commit before.
      - run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF" && since=FETCH_HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git fetch --depth=1 origin "$BEFORE"; then
            since=FETCH_HEAD
          elif git rev-parse --verify --quiet HEAD^ > /dev/null; then
            since=HEAD^
          fi
          uv run python tools/validate.py ${since:+--since "$since"}
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
      # Data a site served wrong goes missing without failing any other check. "[allow-loss]" in the title skips it.
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[allow-loss]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          uv run python tools/check_losses.py --base FETCH_HEAD
      # Every Bandai image is checked only for a release tag: about 5,000 requests the TCGplayer check does not need.
      - run: uv run python tools/validate.py --online ${{ startsWith(github.ref, 'refs/tags/v') && '--images' || '' }}
      - run: uv run python tools/legality.py --online

  # A tag pushed by hand, for a minor version. A release that already exists gets its files again, so a second run
  # is safe.
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --group dev
      - run: tools/release.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # A merge into main that changes sets/, data/ or legality/ is released as the next patch version, so readers of the
  # latest release get it the same day. The daily refresh (refresh.yml) arrives this way. A minor version is still a
  # tag pushed by hand. tools/release.sh creates the release through the API with GITHUB_TOKEN, and the tag it creates
  # starts no run, so the release job above does not run for it.
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and every tag, so the diff can reach the commit before the push and next_version.sh can
      # read the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: |
          base=HEAD^
          if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base=$BEFORE
          fi
          if git diff --quiet "$base" HEAD -- sets data legality; then
            echo "the data did not change: nothing to release"
          elif git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released"
          else
            tag=$(tools/next_version.sh)
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}
      - if: steps.version.outputs.tag
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - if: steps.version.outputs.tag
        run: uv sync --locked --group dev
      - if: steps.version.outputs.tag
        run: tools/release.sh "$TAG" "$GITHUB_SHA"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
