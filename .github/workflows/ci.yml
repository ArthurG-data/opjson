name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      # A UUID, once given, never changes: compare data/uuids.json with the branch a PR targets, or with where the
      # branch was before a push (every commit of the push at once), else with the commit before.
      - run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF" && since=FETCH_HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git fetch --depth=1 origin "$BEFORE"; then
            since=FETCH_HEAD
          elif git rev-parse --verify --quiet HEAD^ > /dev/null; then
            since=HEAD^
          fi
          uv run python tools/validate.py ${since:+--since "$since"}
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
      # Data a site served wrong goes missing without failing any other check. "[allow-loss]" in the title skips it.
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[allow-loss]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          uv run python tools/check_losses.py --base FETCH_HEAD
      # Every Bandai image is checked only for a release tag: about 5,000 requests the TCGplayer check does not need.
      - run: uv run python tools/validate.py --online ${{ startsWith(github.ref, 'refs/tags/v') && '--images' || '' }}
      - run: uv run python tools/legality.py --online

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run python tools/build.py --version "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/AllSets.json dist/AllCards.json dist/AllPrintings.json dist/AllProducts.json dist/Legality.json --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
