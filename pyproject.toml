[project]
name = "opjson"
version = "0.1.0"
description = "An open dataset of One Piece Card Game sets, cards, printings and sealed products"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21"]

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.uv]
package = false
